# Storage backend: jdbc (full read/write) or csv (read-only)
storage = jdbc

# Server
server.port = 7070

# JDBC / PostgreSQL
# Each value below may be overridden by an environment variable when blank:
#   db.url       <- WAREHOUSE_DB_URL
#   db.user      <- WAREHOUSE_DB_USER
#   db.password  <- WAREHOUSE_DB_PASSWORD
# Keep db.password blank in source control; set it via the env var on the host.
db.url = jdbc:postgresql://localhost:5432/warehouse
db.user = postgres
db.password =
db.poolSize = 5

# Default admin (seeded on first run only)
admin.username = admin
admin.password = admin

# Logging: SEVERE, WARNING, INFO, FINE
log.level = INFO

# CSV fallback (read-only mode)
source.laptop = Laptops
source.oven = Ovens
